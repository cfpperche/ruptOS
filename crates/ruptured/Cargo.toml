[package]
name = "ruptured"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ruptOS seat owner: prompt channel and body acts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
